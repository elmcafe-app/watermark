<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="علامتي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>علامتي المائية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Cairo:wght@700&family=Amiri:wght@700&family=Baloo+Bhaijaan+2:wght@700&display=swap">
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#141416;--mut:#6b6b73;--ac:#2563eb;--bd:#d9d9de;--err:#c0262d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1c1d20;--fg:#f2f2f3;--mut:#9a9aa2;--bd:#34353a;--err:#ff7b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111214;--card:#1c1d20;--fg:#f2f2f3;--mut:#9a9aa2;--bd:#34353a;--err:#ff7b80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Cairo,system-ui,sans-serif;direction:rtl;-webkit-touch-callout:none}
.w{max-width:520px;margin:0 auto;padding:10px 16px 20px;display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top b{direction:ltr;unicode-bidi:plaintext;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:grid;gap:10px}
input[type=text]{min-height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;padding:0 14px;width:100%}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-weight:700;cursor:pointer;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.on,.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.pri{min-height:58px;font-size:18px;width:100%}
.pri:disabled{opacity:.6}
.ic{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
.drop{min-height:42vh;border:2px dashed var(--bd);border-radius:14px;background:var(--card);color:var(--mut);font:inherit;font-size:17px;cursor:pointer;padding:16px}
.cvw{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;display:flex;justify-content:center}
canvas{max-width:100%;max-height:40vh;width:auto;height:auto;touch-action:none;border-radius:8px;display:block;user-select:none;-webkit-user-select:none}
#msg{margin:0;min-height:24px;font-size:14px;color:var(--mut);text-align:center}
#msg.err{color:var(--err)}
.strip{overflow-x:auto}
#thumbs{display:flex;gap:8px;padding:2px}
.th{position:relative;flex:none;width:56px;height:56px;border-radius:10px;border:2px solid var(--bd);padding:0;background:var(--card);color:var(--fg);cursor:pointer;overflow:visible;font:inherit;font-size:22px}
.th.on{border-color:var(--ac)}
.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.th .rm{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:14px;line-height:20px;text-align:center}
#ctl{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 .btn{padding:0 6px;font-size:14px}
.row{display:flex;gap:10px}
.row .sq{width:56px;flex:none;font-size:24px;padding:0}
.row .btn:last-child{flex:1;font-size:14px}
.sl{display:grid;grid-template-columns:108px 1fr;align-items:center;gap:10px}
.sl input{width:100%;height:32px;accent-color:var(--ac)}
.cap{font-size:13px;color:var(--mut);font-weight:700;margin-top:6px}
.sl span{white-space:nowrap}.sl small{color:var(--mut);font-weight:400}
details.card{display:block}summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.tools{display:grid;gap:10px;margin-top:8px}
select{min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;padding:0 10px;width:100%}
</style>
</head>
<body>
<div class="w">
 <div class="top" id="top" hidden><b id="who"></b><button class="ic" id="edit" aria-label="تغيير الاسم">✎</button></div>
 <section class="card" id="nameCard" hidden>
  <div>اكتب اسم المستخدم (مرة واحدة بس)</div>
  <input type="text" id="nameIn" dir="auto" placeholder="@username" autocomplete="off" autocapitalize="off">
  <button class="btn pri" id="saveName">حفظ</button>
 </section>
 <main id="app" hidden style="display:grid;gap:10px">
  <button class="drop" id="drop">اضغط لاختيار صور، أو اسحبها هنا، أو الصقها</button>
  <div class="cvw" id="cvw" hidden><canvas id="cv"></canvas></div>
  <p id="msg" role="status"></p>
  <div class="strip" id="strip" hidden><div id="thumbs"></div></div>
  <div id="ctl" hidden>
   <div class="cap">اللوجو بجانب الاسم</div>
   <div class="g3">
    <button class="btn" data-p="bird"></button>
    <button class="btn" data-p="x"></button>
    <button class="btn" data-p="tg"></button>
   </div>
   <div class="cap">شكل الاسم</div>
   <div class="g3">
    <button class="btn" data-f="m" data-l="زي الصورة"></button>
    <button class="btn" data-f="f" data-l="رسمي"></button>
    <button class="btn" data-f="y" data-l="شبابي"></button>
   </div>
   <div class="cap">العلامة (+ نسخة، − حذف، اسحبها بإصبعك)</div>
   <div class="row">
    <button class="btn sq" id="plus" aria-label="إضافة نسخة">+</button>
    <button class="btn sq" id="minus" aria-label="حذف نسخة">−</button>
    <button class="btn" id="only">الصورة دي بس</button>
   </div>
   <label class="sl"><span>الحجم <small id="vsz"></small></span><input type="range" id="sz" min="0" max="1" step="0.01"></label>
   <label class="sl"><span>الشفافية <small id="vtr"></small></span><input type="range" id="tr" min="0" max="0.95" step="0.01"></label>
   <label class="sl"><span>الميلان <small id="vrt"></small></span><input type="range" id="rt" min="-30" max="30" step="1"></label>
   <div class="cap">جودة الصورة</div>
   <label class="sl"><span>الوضوح <small id="vcl"></small></span><input type="range" id="cl" min="0" max="100" step="1"></label>
   <label class="sl"><span>التنظيف <small id="vcn"></small></span><input type="range" id="xcl" min="0" max="100" step="1"></label>
   <select id="up"><option value="1">من غير تكبير</option><option value="2">تكبير ×2 (للصور الصغيرة)</option></select>
   <details class="card" id="more"><summary>أدوات إضافية</summary><div class="tools">
    <div class="g3"><button class="btn" id="rl">↺ تدوير</button><button class="btn" id="rr">↻ تدوير</button><button class="btn" id="fl">⇋ قلب</button></div>
    <div class="cap">القص (من النص، لكل الصور)</div>
    <select id="crop"><option value="0">الأصلي</option><option value="1:1">1:1 مربع</option><option value="4:5">4:5</option><option value="3:4">3:4</option><option value="16:9">16:9</option><option value="9:16">9:16</option></select>
    <div class="cap">تعديلات الألوان (0 = من غير تغيير)</div>
    <label class="sl"><span>السطوع <small id="vbr"></small></span><input type="range" id="xbr" min="-50" max="50" step="1"></label>
    <label class="sl"><span>التباين <small id="vct"></small></span><input type="range" id="xct" min="-50" max="50" step="1"></label>
    <label class="sl"><span>التشبّع <small id="vsa"></small></span><input type="range" id="xsa" min="-100" max="100" step="1"></label>
    <div class="cap">تمويه منطقة (وش، رقم، اسم)</div>
    <div class="g3" style="grid-template-columns:1fr 1fr"><button class="btn" id="bm">تمويه: اسحب</button><button class="btn" id="bc">مسح التمويه</button></div>
    <div class="cap">الحفظ</div>
    <select id="fmt"><option value="orig">نفس الصيغة</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
    <select id="mx"><option value="0">الحجم الأصلي</option><option value="3840">أقصى 3840</option><option value="2048">أقصى 2048</option><option value="1080">أقصى 1080</option></select>
    <div class="g3" style="grid-template-columns:1fr 1fr"><button class="btn" id="cmp">اضغط مطوّلاً: قبل</button><button class="btn" id="rs">إعادة ضبط</button></div>
   </div></details>
   <button class="btn pri" id="dl">تنزيل</button>
  </div>
 </main>
</div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<script>

 let a=0,p1=-1,p99=-1;for(let v=0;v<256;v++){a+=hi[v];if(p1<0&&a>=n*.01)p1=v;if(p99<0&&a>=n*.99)p99=v}
 const cs=Math.min(192,W,H),cc=cv(cs,cs),cx=cc.getContext('2d',{willReadFrequently:true});let sg=1e9,lap=0;
 for(const [u,v] of [[.5,.5],[.25,.3],[.75,.7]]){cx.drawImage(b,clamp(Math.round(u*W-cs/2),0,W-cs),clamp(Math.round(v*H-cs/2),0,H-cs),cs,cs,0,0,cs,cs);
  const r=cropStats(cx.getImageData(0,0,cs,cs).data,cs,cs);sg=Math.min(sg,r.sig);lap=Math.max(lap,r.lap)}

 const k2=Math.min(1,1200/Math.max(W,H)),pv=cv(Math.round(W*k2),Math.round(H*k2));pv.getContext('2d').drawImage(b,0,0,pv.width,pv.height);
 if(b.close)b.close();const pv2=mkpv(pv,pl);
 const t=Math.min(1,96/Math.max(W,H)),tc=cv(Math.max(1,Math.round(W*t)),Math.max(1,Math.round(H*t)));tc.getContext('2d').drawImage(pv2,0,0,tc.width,tc.height);
 const ty=['image/jpeg','image/png','image/webp'].includes(f.type)?f.type:'image/png';
 let note=pl.none?'الصورة كويسة، سبتها زي ما هي.':'اتحسّنت: '+pl.L.join('، ')+' (تحسين محلي، مش AI).';
 if(ty!==f.type)note+=' هتتحفظ PNG.';
 return{file:f,w:W,h:H,raw:pv,pv:pv2,th:tc.toDataURL('image/jpeg',.7),plan:pl,note,type:ty,own:null,pk:[clar,X.br,X.ct,X.sa,X.crop,0,0,X.cl,X.up].join(),rot:0,flip:0,bl:[]}}

/* ---------- العلامة ---------- */
function drawMarks(ctx,W,H,s){const sh=Math.min(W,H),fs=sh*(.015+.07*s.size),ls=fs*1.15,gap=fs*.3;
 ctx.save();ctx.globalAlpha=1-s.t;ctx.font=FW[s.f||'m']+' '+fs+'px '+FN[s.f||'m']+',sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
 ctx.direction=/[\u0600-\u06FF]/.test(name)?'rtl':'ltr';
 const tw=ctx.measureText(name).width,w=ls+gap+tw,h=Math.max(ls,fs*1.3);
 ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=fs*.3;ctx.shadowOffsetY=fs*.06;
 const out=s.marks.map(m=>{const rr=(s.rot||0)*Math.PI/180,ca=Math.abs(Math.cos(rr)),sa=Math.abs(Math.sin(rr)),hw=(w*ca+h*sa)/2,hh=(w*sa+h*ca)/2,cx=Math.max(hw,Math.min(W-hw,m.x*W)),cy=Math.max(hh,Math.min(H-hh,m.y*H));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rr);ctx.save();ctx.translate(-w/2,-ls/2);ctx.scale(ls/24,ls/24);ctx.fill(P2[s.p]);ctx.restore();
  ctx.fillText(name,-w/2+ls+gap,0);ctx.restore();
  return{x0:(cx-hw)/W,x1:(cx+hw)/W,y0:(cy-hh)/H,y1:(cy+hh)/H}});
 ctx.restore();return out}

/* ---------- الواجهة ---------- */
function noteOf(im){const l=[];if(im.plan.dn)l.push('تقليل تشويش');if(X.cl)l.push('تنظيف');if(X.up===2)l.push('تكبير ×2');if(clar>0)l.push('حدة');return (l.length?'اتحسّنت: '+l.join(' + ')+' (محلي، مش AI، والملامح زي ما هي).':'سبتها زي ما هي.')+(im.type!==im.file.type?' هتتحفظ PNG.':'')}
function lab(){const s=imgs[cur]?tgt():G;$('#vsz').textContent=Math.round(s.size*100)+'%';$('#vtr').textContent=Math.round(s.t*100)+'%';$('#vrt').textContent=(s.rot||0)+'°';$('#vcl').textContent=clar+'%';$('#vbr').textContent=X.br;$('#vct').textContent=X.ct;$('#vsa').textContent=X.sa;$('#vcn').textContent=X.cl+'%'}
function draw(){const im=imgs[cur];if(!im)return;const k=gk(im);if(im.pk!==k){im.pv=mkpv(im.raw,im.plan,im);im.pk=k}
 const src=cmp?im.raw:im.pv,c=$('#cv');
 if(c.width!=src.width||c.height!=src.height){c.width=src.width;c.height=src.height}
 const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(src,0,0);
 if(cmp){rects=[];return}
 pix(x,c.width,c.height,im.bl);
 if(nb){x.save();x.strokeStyle='#fff';x.lineWidth=2;x.setLineDash([8,6]);x.strokeRect(Math.min(nb.x0,nb.x1)*c.width,Math.min(nb.y0,nb.y1)*c.height,Math.abs(nb.x1-nb.x0)*c.width,Math.abs(nb.y1-nb.y0)*c.height);x.restore()}
 rects=drawMarks(x,c.width,c.height,S(im))}
function thumbs(){const t=$('#thumbs');t.textContent='';
 imgs.forEach((im,i)=>{const b=document.createElement('button');b.className='th'+(i==cur?' on':'');const g=new Image();g.src=im.th;b.append(g);
  b.onclick=()=>{cur=i;sel=0;sync()};const r=document.createElement('span');r.className='rm';r.textContent='×';r.onclick=e=>{e.stopPropagation();imgs.splice(i,1);if(cur>=imgs.length)cur=imgs.length-1;else if(i<cur)cur--;sel=0;sync()};b.append(r);t.append(b)});
 const a=document.createElement('button');a.className='th';a.textContent='+';a.setAttribute('aria-label','إضافة صور');a.onclick=()=>$('#fi').click();t.append(a)}
function sync(){const im=imgs[cur];
 for(const id of ['drop'])$('#'+id).hidden=!!im;
 for(const id of ['cvw','ctl','strip'])$('#'+id).hidden=!im;
 if(!im){msg('');return}
 const s=S(im);document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p==s.p));
 document.querySelectorAll('[data-f]').forEach(b=>{b.textContent='';const a=document.createElement('span');a.dir='auto';a.textContent=name;const l=document.createElement('small');l.textContent=b.dataset.l;l.style.cssText='display:block;font:12px system-ui,sans-serif;opacity:.75';b.append(a,l);b.style.fontFamily=FN[b.dataset.f]+',sans-serif';b.classList.toggle('on',b.dataset.f==(s.f||'m'))});
 loadFont(s.f).then(draw);
 $('#sz').value=s.size;$('#tr').value=s.t;$('#rt').value=s.rot||0;$('#cl').value=clar;$('#xcl').value=X.cl;$('#up').value=X.up;$('#xbr').value=X.br;$('#xct').value=X.ct;$('#xsa').value=X.sa;$('#crop').value=X.crop;$('#fmt').value=X.fmt;$('#mx').value=X.mx;lab();$('#only').classList.toggle('on',!!im.own);
 thumbs();draw();msg(noteOf(im))}
function showApp(){const has=!!name;$('#nameCard').hidden=has;$('#app').hidden=!has;$('#top').hidden=!has;$('#who').textContent=name;if(has)sync()}
$('#saveName').onclick=()=>{const v=$('#nameIn').value.trim();if(!v)return;name=v;try{localStorage.setItem('wm_name',v)}catch(e){}showApp();loadFont().then(draw)};
$('#nameIn').onkeydown=e=>{if(e.key==='Enter')$('#saveName').click()};
$('#edit').onclick=()=>{$('#nameCard').hidden=false;$('#app').hidden=true;$('#nameIn').value=name;$('#nameIn').focus()};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{tgt().p=b.dataset.p;try{localStorage.setItem('wm_p',b.dataset.p)}catch(e){}sync()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{tgt().f=b.dataset.f;try{localStorage.setItem('wm_f',b.dataset.f)}catch(e){}loadFont(b.dataset.f).then(sync)});
$('#sz').oninput=e=>{tgt().size=+e.target.value;lab();draw()};
$('#rt').oninput=e=>{tgt().rot=+e.target.value;lab();draw()};
$('#rl').onclick=()=>{const m=imgs[cur];m.rot=(m.rot+3)%4;m.bl=[];draw()};
$('#rr').onclick=()=>{const m=imgs[cur];m.rot=(m.rot+1)%4;m.bl=[];draw()};
$('#fl').onclick=()=>{const m=imgs[cur];m.flip^=1;m.bl=[];draw()};
$('#crop').onchange=e=>{X.crop=e.target.value;imgs.forEach(m=>m.bl=[]);draw()};
$('#xcl').oninput=e=>{X.cl=+e.target.value;lab();clearTimeout(ct);ct=setTimeout(draw,120)};
$('#up').onchange=e=>{X.up=+e.target.value;draw()};
$('#fmt').onchange=e=>{X.fmt=e.target.value};
$('#mx').onchange=e=>{X.mx=+e.target.value};
for(const k of ['br','ct','sa'])$('#x'+k).oninput=e=>{X[k]=+e.target.value;lab();clearTimeout(ct);ct=setTimeout(draw,120)};
$('#bm').onclick=e=>{bm=!bm;e.currentTarget.classList.toggle('on',bm)};
$('#bc').onclick=()=>{imgs[cur].bl=[];draw()};
$('#rs').onclick=()=>{X.br=X.ct=X.sa=0;X.crop='0';imgs.forEach(m=>{m.rot=0;m.flip=0;m.bl=[]});sync()};
{const cb=$('#cmp');cb.oncontextmenu=e=>e.preventDefault();cb.onpointerdown=()=>{cmp=1;draw()};cb.onpointerup=cb.onpointerleave=cb.onpointercancel=()=>{if(cmp){cmp=0;draw()}}}
$('#cl').oninput=e=>{clar=+e.target.value;try{localStorage.setItem('wm_c',clar)}catch(x){}lab();clearTimeout(ct);ct=setTimeout(draw,120)};
$('#tr').oninput=e=>{tgt().t=+e.target.value;lab();draw()};
$('#plus').onclick=()=>{const s=tgt(),n=s.marks.length;if(n>=8)return;s.marks.push({x:.5,y:clamp(.5+(n%2?-1:1)*Math.ceil(n/2)*.15,.1,.9)});sel=n;draw()};
function del(i){const s=tgt();if(s.marks.length>1){s.marks.splice(i,1);sel=s.marks.length-1;draw()}}
$('#minus').onclick=()=>del(Math.min(sel,tgt().marks.length-1));
$('#only').onclick=()=>{const im=imgs[cur];im.own=im.own?null:JSON.parse(JSON.stringify(G));sync()};
const cvEl=$('#cv');
const rel=e=>{const r=cvEl.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
cvEl.oncontextmenu=e=>e.preventDefault();
cvEl.onpointerdown=e=>{const p=rel(e);if(bm){nb={x0:p.x,y0:p.y,x1:p.x,y1:p.y};cvEl.setPointerCapture(e.pointerId);return}let hit=-1;
 for(let i=rects.length-1;i>=0;i--){const r=rects[i];if(p.x>=r.x0-.02&&p.x<=r.x1+.02&&p.y>=r.y0-.02&&p.y<=r.y1+.02){hit=i;break}}
 if(hit<0)return;sel=hit;const r=rects[hit];
 drag={i:hit,dx:(r.x0+r.x1)/2-p.x,dy:(r.y0+r.y1)/2-p.y,sx:e.clientX,sy:e.clientY,moved:false};
 cvEl.setPointerCapture(e.pointerId);clearTimeout(lp);
 lp=setTimeout(()=>{if(drag&&!drag.moved){const i=drag.i;drag=null;del(i);if(navigator.vibrate)navigator.vibrate(30)}},600)};
cvEl.onpointermove=e=>{if(nb){const p=rel(e);nb.x1=clamp(p.x,0,1);nb.y1=clamp(p.y,0,1);draw();return}if(!drag)return;
 if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){drag.moved=true;clearTimeout(lp)}
 if(drag.moved){const p=rel(e),m=tgt().marks[drag.i];if(!m)return;m.x=clamp(p.x+drag.dx,0,1);m.y=clamp(p.y+drag.dy,0,1);draw()}};
cvEl.onpointerup=cvEl.onpointercancel=()=>{if(nb){const r={x:Math.min(nb.x0,nb.x1),y:Math.min(nb.y0,nb.y1),w:Math.abs(nb.x1-nb.x0),h:Math.abs(nb.y1-nb.y0)};nb=null;if(r.w>.01&&r.h>.01)imgs[cur].bl.push(r);draw();return}clearTimeout(lp);drag=null};

/* ---------- رفع ---------- */
async function add(files){files=[...files].filter(f=>f.type.startsWith('image/')||!f.type);if(!files.length||busy)return;
 busy=true;let ok=0,bad=0;const first=imgs.length;
 for(let i=0;i<files.length;i++){msg('جاري تحليل الصور '+(i+1)+'/'+files.length+'…');
  try{imgs.push(await load(files[i]));ok++}catch(e){bad++}
  await new Promise(r=>setTimeout(r))}
 busy=false;if(ok)cur=first;sel=0;sync();
 if(bad)msg(bad+' صورة مش مدعومة (HEIC مثلاً). حوّلها JPEG أو PNG وارفعها تاني.',true)}
$('#drop').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{add(e.target.files);e.target.value=''};
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?e.clipboardData.files:[])];if(f.length)add(f)});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)add(e.dataTransfer.files)});

/* ---------- تنزيل ---------- */
async function exp(im){let b;try{b=await decode(im.file)}catch(e){throw new Error('الصيغة مش مدعومة')}
 let c=geo(b,im.rot,im.flip,X.crop);if(b.close)b.close();if(X.up===2&&c.width*c.height*4<=16e6)c=up2(c);
 process(c,im.plan,clar/50);adj(c);const x=c.getContext('2d');pix(x,c.width,c.height,im.bl);
 await loadFont(S(im).f);drawMarks(x,c.width,c.height,S(im));
 const m=Math.max(c.width,c.height);if(X.mx&&m>X.mx){const k=X.mx/m,d=cv(Math.round(c.width*k),Math.round(c.height*k)),dx=d.getContext('2d');dx.imageSmoothingQuality='high';dx.drawImage(c,0,0,d.width,d.height);c=d}
 return new Promise(r=>c.toBlob(r,otype(im),.95))}
async function save(blob,filename){let d=null;
 try{if(window.claude&&claude.use)d=await claude.use('downloads')}catch(e){}
 if(d){await d.save({filename,data:blob});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const declined=e=>e&&(e.code==='declined'||/declin/i.test(String(e.message||'')));
let ready=null,rsig='';
const sig=()=>JSON.stringify([name,G,clar,X,imgs.map(i=>[i.file.name,i.file.size,i.own,i.rot,i.flip,i.bl])]);
$('#dl').onclick=async()=>{if(busy||!imgs.length)return;
 if(ready&&rsig===sig()){const fs=ready.map(r=>new File([r.blob],r.fn,{type:r.blob.type}));
  if(navigator.canShare&&navigator.canShare({files:fs})){try{await navigator.share({files:fs});msg('تم.');return}catch(e){if(e&&e.name==='AbortError'){msg('اتلغى.');return}}}
  busy=true;let n=0;try{for(const r of ready){await save(r.blob,r.fn);n++}msg('تم تنزيل '+n+' صورة.')}catch(e){msg(declined(e)?'اتلغى التنزيل بعد '+n+' صورة.':'مشكلة في الحفظ: '+((e&&e.message)||e),!declined(e))}
  busy=false;return}
 busy=true;const bt=$('#dl');bt.disabled=true;let ok=0;const used=new Set();const out=[];
 try{for(let i=0;i<imgs.length;i++){msg('جاري التجهيز '+(i+1)+'/'+imgs.length+'…');const im=imgs[i],blob=await exp(im);
   if(!blob)throw new Error('الصورة كبيرة على المتصفح ده');
   const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[otype(im)],base=(im.file.name.replace(/\.[^.]+$/,'')||'image')+'-wm';
   let fn=base+'.'+ext;if(used.has(fn))fn=base+'-'+(i+1)+'.'+ext;used.add(fn);
   out.push({blob,fn});ok++}
  ready=out;rsig=sig();bt.textContent='حفظ في الصور';msg('جاهزة. اضغط "حفظ في الصور".')}
 catch(e){msg(declined(e)?'اتلغى التنزيل بعد '+ok+' صورة.':'مشكلة في التنزيل: '+((e&&e.message)||e),!declined(e))}
 busy=false;bt.disabled=false};

try{const c=cv(180,180),x=c.getContext('2d');x.fillStyle='#2563eb';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.translate(45,45);x.scale(3.75,3.75);x.fill(P2.bird);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
showApp();if(!name)$('#nameIn').focus();loadFont().then(draw);
</script>
</body>
